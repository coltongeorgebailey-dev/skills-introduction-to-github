<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3d7a32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Harvest Haven</title>
</head>
<body>

  <!-- HUD Overlay -->
  <div id="hud">
    <div id="hud-left">
      <span id="hud-coins">🪙 100</span>
      <span id="hud-gems">💎 10</span>
    </div>
    <div id="hud-right">
      <span id="hud-season">🌸 Spring · D1/7</span>
      <button id="btn-mute" title="Toggle sound">🔊</button>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Notification toast -->
  <div id="notification"></div>

  <!-- Tool Bar -->
  <div id="toolbar-wrap">
    <div id="toolbar"></div>
    <div id="seed-carousel" style="display:none">
      <button id="seed-prev">◀</button>
      <span id="seed-label">🌾 Wheat ×0</span>
      <button id="seed-next">▶</button>
    </div>
    <div id="toolbar-actions">
      <button id="btn-talk" title="Talk to the NPC (Enter)" style="display:none">💬 Talk</button>
      <button id="btn-sleep" title="Skip to next day (E)">⏭️ Skip Day</button>
    </div>
  </div>

  <!-- D-Pad (mobile movement) -->
  <div id="dpad">
    <button id="dpad-up">▲</button>
    <div id="dpad-mid">
      <button id="dpad-left">◀</button>
      <div id="dpad-center"></div>
      <button id="dpad-right">▶</button>
    </div>
    <button id="dpad-down">▼</button>
  </div>

  <!-- Modals -->
  <div id="modal-shop" class="modal"></div>
  <div id="modal-progression" class="modal"></div>
  <div id="modal-skins" class="modal"></div>
  <div id="modal-furniture" class="modal"></div>
  <div id="modal-gems" class="modal"></div>
  <div id="modal-quests" class="modal"></div>
  <div id="modal-barn" class="modal"></div>
  <div id="modal-fishing" class="modal"></div>
  <div id="modal-tutorial" class="modal"></div>

  <!-- Controls help (desktop only) -->
  <div id="controls-help">
    <strong>Controls:</strong> WASD/Arrows = Move &nbsp;|&nbsp; 1=Hoe 2=Water 3=Seed 4=Harvest 5=Fish &nbsp;|&nbsp; Q=Cycle seed &nbsp;|&nbsp; E=Skip Day &nbsp;|&nbsp; Walk out the gate &amp; press Enter to talk to a shopkeeper &nbsp;|&nbsp; Esc=Back to farm
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
